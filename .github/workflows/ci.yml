name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check version stamp
        run: >-
          node -e "const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('dist/version.json', 'utf8')).version;
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!v || !html.includes('name=\"app-version\" content=\"' + v + '\"')) process.exit(1);
          console.log('version', v)"
